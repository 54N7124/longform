<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>longform</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1c1a; --muted:#6b675f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161513; --fg:#ece9e3; --muted:#9a958b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.7 Georgia, "Times New Roman", serif; }
  main { max-width: 38rem; margin: 0 auto; padding: 4rem 1rem; }
  h1 { font-size: 2.4rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  p.sub { color: var(--muted); margin-top: 0; }
</style>
</head>
<body>
<main>
  <h1>longform</h1>
  <p class="sub">Writing, at length.</p>
  <p>Nothing published yet.</p>
</main>
</body>
</html>
